[package]
name = "browser-structure"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]
path = "engine.rs"

[dependencies]
legal-structure = { git = "https://github.com/eliziff/legal-structure-parser.git", rev = "3eb592b2684e4ad879f2cb2ac95eaea3158e47bc", features = ["provider-text"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
regex = "1.11"
image = { version = "0.25", default-features = false }
legal-pdf-core = { git = "https://github.com/eliziff/legal-pdf-parser.git", rev = "3a9fd6617a298aee9bffebde4d254454638312ad" }
legal-pdf-structure = { git = "https://github.com/eliziff/legal-pdf-parser.git", rev = "3a9fd6617a298aee9bffebde4d254454638312ad" }

[profile.release]
opt-level = "s"
lto = true
strip = true
