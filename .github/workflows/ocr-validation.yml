name: OCR export validation
on:
  push:
    branches: [fix/searchable-pdf-text-layer]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --save-exact pdf-lib@1.17.1
      - run: npm test
      - name: Prepare validation dependencies
        run: tar --exclude=.git -czf "$RUNNER_TEMP/ocr-validation.tgz" .
      - uses: actions/upload-artifact@v4
        with:
          name: ocr-validation
          path: ${{ runner.temp }}/ocr-validation.tgz
          retention-days: 1
